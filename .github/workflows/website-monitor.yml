name: Weekly Website Monitor

on:
  schedule:
    - cron: '30 2 * * 1'   # Every Monday 8:00 AM IST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run website monitor & send report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GC_API_TOKEN: ${{ secrets.GC_API_TOKEN }}
          GC_SITE_NETLIFY: ${{ secrets.GC_SITE_NETLIFY }}
          GC_SITE_GITHUB: ${{ secrets.GC_SITE_GITHUB }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: node src/monitor.js
